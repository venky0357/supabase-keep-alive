name: Supabase Keep Alive

on:
  schedule:
    # Every day at 9:47 AM IST
    - cron: "17 04 * * *"

  # Allows manual testing from GitHub
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase database
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase response: $response"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Supabase request failed"
            exit 1
          fi

          echo "Supabase keep-alive request successful"

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
